name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Frontend Build Verification & Asset Audit
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  # 2. Python ML Microservice Verification
  ml-service:
    name: ML Microservice Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-server/requirements.txt

      - name: Install ML Dependencies
        working-directory: ml-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate ML Artifacts & Startup Syntax
        working-directory: ml-server
        run: |
          python -c "import joblib, sklearn, pandas, flask; print('Dependencies successfully verified')"
          python -c "import app; print('ML application modules and models load successfully')"

  # 3. Full-Stack End-to-End Integration Test Suite
  integration-tests:
    name: Full-Stack Integration Suite
    runs-on: ubuntu-latest
    needs: [frontend, ml-service]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-server/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install ML Dependencies
        working-directory: ml-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ML Service in Background
        working-directory: ml-server
        run: |
          nohup python app.py > /tmp/ml-server.log 2>&1 &
          sleep 4
          curl -f http://localhost:5001/health || (cat /tmp/ml-server.log && exit 1)

      - name: Start Express Backend in Background
        working-directory: backend
        env:
          PORT: 5000
          ML_SERVER_URL: http://localhost:5001
          JWT_SECRET: ci-test-secret-key-agroinone-32chars-min
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || '' }}
        run: |
          nohup node index.js > /tmp/backend.log 2>&1 &
          sleep 4
          curl -f http://localhost:5000/health || (cat /tmp/backend.log && exit 1)

      - name: Execute Automated Integration Test Suite
        working-directory: backend
        env:
          TEST_API_URL: http://localhost:5000/api
          TEST_ML_URL: http://localhost:5001
          JWT_SECRET: ci-test-secret-key-agroinone-32chars-min
        run: npm test
